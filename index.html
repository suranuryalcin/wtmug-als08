<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Transfer — Web Arayüzü</title>
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/desktop.css" />
</head>
<body data-role="desktop">

  <!-- ================= BAĞLANTI EKRANI ================= -->
  <section id="connect-screen" class="screen active">
    <div class="card">
      <h1>📡 P2P Transfer</h1>
      <p class="subtitle">Telefonunuzla bu QR kodu okutun</p>

      <div id="qr-container" class="qr-box">
        <div id="qr-loading">QR kod hazırlanıyor…</div>
        <div id="qrcode"></div>
      </div>

      <p class="peer-id-line">
        Bağlantı Kimliği: <code id="peer-id-display">…</code>
        <button id="copy-id-btn" class="mini-btn" title="Kopyala">📋</button>
      </p>

      <p class="status" id="connect-status">Sunucuya bağlanılıyor…</p>
    </div>
  </section>

  <!-- ================= SOHBET / TRANSFER EKRANI ================= -->
  <section id="chat-screen" class="screen">
    <header class="chat-header">
      <span class="dot connected"></span>
      <strong>Bağlandı</strong>
      <span id="peer-label" class="peer-label"></span>
      <button id="disconnect-btn" class="danger-btn">Bağlantıyı Kes</button>
    </header>

    <main id="messages" class="messages"></main>

    <div id="progress-area" class="progress-area hidden">
      <div class="progress-label">
        <span id="progress-name">Dosya</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
    </div>

    <footer class="composer">
      <label class="file-btn" title="Dosya gönder">
        📎
        <input type="file" id="file-input" hidden />
      </label>
      <textarea id="message-input" rows="1" placeholder="Mesaj yazın… (Enter = gönder)"></textarea>
      <button id="send-btn" class="send-btn">Gönder</button>
    </footer>
  </section>

  <!-- Kütüphaneler -->
  <script src="lib/peerjs.min.js"></script>
  <script src="lib/qrcode.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/desktop.js"></script>
<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('[PWA] SW kayıtlı:', reg.scope))
          .catch((err) => console.warn('[PWA] SW kayıt hatası:', err));
      });
    }
    </script>
</body>

</html>
